#@TYPE: Machine
#@NAME: PCB Arts Helium with Jetson Orin NX 16GB (P3767-0000)
#@DESCRIPTION: PCB Arts Helium (HOX2-D1-V5), Orin NX 16GB, rootfs on NVMe

require conf/machine/include/orin-nx.inc

# Flash the OSTree sysroot (ota-ext4), not the plain rootfs. Torizon sets this
# in tegra-torizon.inc, but that is included from local.conf, and meta-tegra
# R39's tegra234.inc (parsed later, with the machine config) hard-assigns
# "ext4". With "ext4" the board boots without an OSTree deployment and
# aktualizr-torizon cannot start ("could not load sysroot").
IMAGE_TEGRAFLASH_FS_TYPE = "ota-ext4"

# Do not ship the DTB in the OSTree deployment. Torizon's UEFI patch only loads
# the DTB from the deployment when uEnv.txt has both fdtdir and fdtfile; that
# file DTB lacks the overlays UEFI applies to the kernel-dtb partition DTB
# (tegra234-carveouts, tegra-optee, p3768 dynamic), and the board did not come
# up with it. Without fdtdir, UEFI boots the OSTree kernel/initramfs with the
# kernel-dtb partition DTB (the Helium DTB + overlays), as on the non-OSTree boot.
OSTREE_DEPLOY_DEVICETREE:helium-orin-nx = "0"

# Ethernet 1 is the on-module RTL8111 (PCIe C8). meta-tegra puts its driver in
# the devkit carrier include (p3768.inc); take only the Ethernet part of it,
# not the devkit Wi-Fi/Bluetooth.
HELIUM_ETHERNET_RRECOMMENDS = "${@'nv-kernel-module-r8168' if d.getVar('TEGRA_USING_VENDOR_KERNEL') else 'kernel-module-r8169'} kernel-module-realtek linux-firmware-rtl8168"

# Helium on-board peripherals: Ethernet 2 (LAN7430), RTC (MCP7940),
# IMU (ICM-42670-P), crypto (ATSHA204A).
MACHINE_EXTRA_RRECOMMENDS += " \
    ${HELIUM_ETHERNET_RRECOMMENDS} \
    kernel-module-lan743x \
    kernel-module-rtc-ds1307 \
    kernel-module-inv-icm42600-i2c \
    kernel-module-atmel-sha204a \
"

# Helium routes a UPHY lane to PCIe C9 (x1) for the LAN7430 second Ethernet.
TEGRA_FLASHVAR_ODMDATA = "gbe-uphy-config-9,hsstp-lane-map-3,hsio-uphy-config-0"

# Pinmux / GPIO / pad voltage generated by PCB Arts from helium_dp.xlsm,
# taken from their public JetPack 36.5.0 flash package (orin_nx_hdmi_a03-*),
# installed under tegra234-* names by tegra-bootfiles_%.bbappend.
TEGRA_FLASHVAR_PINMUX_CONFIG = "tegra234-mb1-bct-pinmux-p3767-helium.dtsi"
TEGRA_FLASHVAR_PMC_CONFIG = "tegra234-mb1-bct-padvoltage-p3767-helium.dtsi"

# Stock devkit DTB plus the Helium overlay, merged at build time
# (Torizon's UEFI boots the DTB from the OSTree deployment, so the
# carrier changes must be part of the DTB itself).
KERNEL_DEVICETREE = "tegra234-p3768-0000+p3767-0000-helium.dtb"
