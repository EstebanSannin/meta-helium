#@TYPE: Machine
#@NAME: PCB Arts Helium with Jetson Orin NX 16GB (P3767-0000)
#@DESCRIPTION: PCB Arts Helium (HOX2-D1-V5), Orin NX 16GB, rootfs on NVMe

require conf/machine/include/orin-nx.inc

# Helium routes a UPHY lane to PCIe C9 (x1) for the LAN7430 second Ethernet.
TEGRA_FLASHVAR_ODMDATA = "gbe-uphy-config-9,hsstp-lane-map-3,hsio-uphy-config-0"

# Pinmux / GPIO / pad voltage generated by PCB Arts from helium_dp.xlsm,
# taken from their public JetPack 36.5.0 flash package (orin_nx_hdmi_a03-*),
# installed under tegra234-* names by tegra-bootfiles_%.bbappend.
TEGRA_FLASHVAR_PINMUX_CONFIG = "tegra234-mb1-bct-pinmux-p3767-helium.dtsi"
TEGRA_FLASHVAR_PMC_CONFIG = "tegra234-mb1-bct-padvoltage-p3767-helium.dtsi"

# Stock devkit DTB plus the Helium overlay, merged at build time
# (Torizon's UEFI boots the DTB from the OSTree deployment, so the
# carrier changes must be part of the DTB itself).
KERNEL_DEVICETREE = "tegra234-p3768-0000+p3767-0000-helium.dtb"
