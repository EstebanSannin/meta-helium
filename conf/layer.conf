# PCB Arts Helium (Jetson Orin NX/Nano carrier) support for Torizon OS
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "helium"
BBFILE_PATTERN_helium = "^${LAYERDIR}/"
BBFILE_PRIORITY_helium = "20"

LAYERDEPENDS_helium = "core tegra"
LAYERSERIES_COMPAT_helium = "wrynose"
